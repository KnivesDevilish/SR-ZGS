# SR-Source - DolRecomp settings for Sonic Riders: Zero Gravity (Wii, NTSC-U).
# Sourced by tools/dolrecomp/recompile.sh (plain bash KEY=VALUE). Another
# game has its own file, recomp-<GAME_ID>.conf: recomp-GXEE8P.conf for Sonic
# Riders (GameCube), used by `tools/dolrecomp/recompile.sh GXEE8P`.
#
# DolRecomp has no config file of its own for the C backend: everything is a
# command-line flag, so this file is the single place those flags live.
# (Its TOML patch file, --config, only works with the LLVM backend + the
# ModernGekko runtime, which we adopt later for performance.)

# Six-character disc ID. Must equal the first 6 bytes of the game's sys/boot.bin.
GAME_ID="RS9E8P"

# CPU profile: "broadway" = Wii. ("gekko" would be GameCube.)
CPU="broadway"

# Code generator: "c" = portable C (Phase 1, always available).
#                 "llvm" = optimized native objects (needs LLVM 19/20, see
#                          tools/build_tools.sh).
# BACKEND=llvm before the command chooses it for one run, without editing this:
#   BACKEND=llvm tools/dolrecomp/recompile.sh
BACKEND="c"

# Extra DolRecomp flags, word-split. Leave empty until you have a reason.
# Examples: "--state-in-memory"
EXTRA_ARGS=""

# --- Optional overrides (defaults shown) ------------------------------------
# ASSETS_DIR="game_assets"                   # default: game_assets if it is this game,
#                                            # else the launcher's extracted copy
# DOL_PATH="game_assets/sys/main.dol"        # falls back to <ASSETS_DIR>/main.dol
# DOLRECOMP_BIN="build/dolrecomp/dolrecomp"
# JOBS=4                                     # defaults to nproc
