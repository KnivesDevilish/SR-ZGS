# SR:ZGS - DolRecomp settings.
# Sourced by tools/dolrecomp/recompile.sh (plain bash KEY=VALUE).
#
# DolRecomp has no config file of its own for the C backend: everything is a
# command-line flag, so this file is the single place those flags live.
# (Its TOML patch file, --config, only works with the LLVM backend + the
# ModernGekko runtime, which we adopt later for performance.)

# Six-character disc ID. Must equal the first 6 bytes of game_assets/sys/boot.bin.
GAME_ID="RS9E8P"

# CPU profile: "broadway" = Wii. ("gekko" would be GameCube.)
CPU="broadway"

# Code generator: "c" = portable C (Phase 1, always available).
#                 "llvm" = optimized native objects (needs LLVM 19/20; Phase 1 perf work).
BACKEND="c"

# Extra DolRecomp flags, word-split. Leave empty until you have a reason.
# Examples: "--state-in-memory"
EXTRA_ARGS=""

# --- Optional overrides (defaults shown) ------------------------------------
# DOL_PATH="game_assets/sys/main.dol"        # falls back to game_assets/main.dol
# DOLRECOMP_BIN="build/dolrecomp/dolrecomp"
# JOBS=4                                     # defaults to nproc
