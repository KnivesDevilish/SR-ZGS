# SR-Source - DolRecomp settings for Sonic Riders (GameCube, NTSC-U).
# Sourced by `tools/dolrecomp/recompile.sh GXEE8P` (plain bash KEY=VALUE).
# The same settings as recomp.conf (Zero Gravity), with the GameCube's CPU.

# Six-character disc ID. Must equal the first 6 bytes of the game's sys/boot.bin.
GAME_ID="GXEE8P"

# CPU profile: "gekko" = GameCube (Zero Gravity's is "broadway", the Wii's).
CPU="gekko"

# Code generator: "c" = portable C, as Zero Gravity's; "llvm" = optimized
# native objects (needs LLVM 19/20, see tools/build_tools.sh). BACKEND=llvm
# before the command chooses it for one run, without editing this:
#   BACKEND=llvm tools/dolrecomp/recompile.sh GXEE8P
BACKEND="c"

# Extra DolRecomp flags, word-split. Leave empty until you have a reason.
EXTRA_ARGS=""

# --- Optional overrides (defaults shown) ------------------------------------
# ASSETS_DIR="game_assets"                   # default: game_assets if it is this game,
#                                            # else the launcher's extracted copy
#                                            # (~/.local/share/sr-source/games/GXEE8P)
# DOL_PATH="<ASSETS_DIR>/sys/main.dol"       # falls back to <ASSETS_DIR>/main.dol
# DOLRECOMP_BIN="build/dolrecomp/dolrecomp"
# JOBS=4                                     # defaults to nproc
