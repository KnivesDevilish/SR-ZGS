# SR:ZGS runtime settings (ModernGekko frontend format).
# This is the TEMPLATE. CMake copies it to <SRZGS_USER_DIR>/config.ini the first time
# you configure; edit that copy (it is never overwritten).

[Video]
# Dolphin's internal render scale, not the window size. 640x528 is native Wii
# (1x): the right start for an Intel HD 5500. Valid values: 640x528 1280x720
# 1920x1080 2560x1440 3840x2160 5120x2880 7680x4320
resolution=640x528
# Vulkan or OpenGL. Switch to OpenGL if Vulkan fails to initialise.
backend=Vulkan
fullscreen=false
# Shows the frame rate in the window title: our Phase 1 60 FPS metric.
show_fps_in_title=true

[Input]
# Without a controller the game boots but ignores input. Use Dolphin's device
# name for your pad: SDL/<index>/<name>, e.g. SDL/0/Xbox 360 Controller.
# The first run then writes <SRZGS_USER_DIR>/Config/WiimoteNew.ini (sideways Wii Remote
# mapping) from it. If that file already exists it is reused untouched.
# controller1=SDL/0/<your pad name>
