# Sonic Riders (GameCube, NTSC-U): settings for SR-Source's StaticRecomp CPU core.
# Copied over Sys/GameSettings/GXEE8P.ini of ModernGekko's Dolphin by
# tools/build_tools.sh --chassis (MODERNGEKKO_GAME_SETTINGS_OVERRIDE).
# JIT64 doesn't read them.
[Core]
# That file sent 0x8000ADE0-0x8000B5E0, the SDK's cache functions (DCFlushRange,
# DCStoreRange...), to the interpreter one instruction at a time. The
# recompiled code runs them now: no range is forced.
StaticRecompFallbackRanges =
# The OS idle loop (lwz/cmplwi/beq on the run-queue bits, waiting for a thread
# to be ready): StaticRecomp skips to the next event there, as JIT64's idle
# skipping does.
StaticRecompIdlePC = 0x80010574
