# Sonic Riders: Zero Gravity (Wii, NTSC-U): settings for SR-Source's StaticRecomp CPU core.
# Copied into Sys/GameSettings/ by tools/build_tools.sh --chassis
# (MODERNGEKKO_GAME_SETTINGS_OVERRIDE). JIT64 doesn't read them.
[Core]
# The OS idle loop (lwz/cmpwi/beq on the run-queue bits, waiting for a thread
# to be ready): StaticRecomp skips to the next event there, as JIT64's idle
# skipping does.
StaticRecompIdlePC = 0x80059F08
